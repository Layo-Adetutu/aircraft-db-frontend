<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircraft Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="max-w-4xl mx-auto mt-10 p-6 bg-white rounded-2xl shadow-lg">
  <h1 class="text-3xl font-bold text-center text-blue-700 mb-6">My Aircraft Database</h1>

  <!-- Notification -->
  <div id="toast" class="fixed top-4 right-4 p-4 bg-green-500 text-white rounded hidden"></div>

  <!-- Form -->
  <form id="aircraftForm" class="space-y-4 mb-4">
    <input type="text" id="name" placeholder="Aircraft Name" class="w-full p-2 border rounded" required>
    <input type="text" id="reg_number" placeholder="Registration Number" class="w-full p-2 border rounded" required>
    <input type="number" id="price" placeholder="Price ($)" class="w-full p-2 border rounded" required>
    <input type="text" id="country" placeholder="Country" class="w-full p-2 border rounded" required>
    <input type="number" id="speed" placeholder="Speed (km/h)" class="w-full p-2 border rounded" required>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition duration-300">
      Add New Aircraft
    </button>
  </form>

  <!-- Search -->
  <div class="mb-4 flex gap-2">
    <input type="text" id="searchName" placeholder="Search by Name" class="flex-1 p-2 border rounded">
    <input type="text" id="searchReg" placeholder="Search by Reg. Number" class="flex-1 p-2 border rounded">
    <button id="searchBtn" class="bg-yellow-500 text-white px-4 rounded hover:bg-yellow-600 transition duration-300">Search</button>
    <button id="resetBtn" class="bg-gray-400 text-white px-4 rounded hover:bg-gray-500 transition duration-300">Reset</button>
  </div>

  <!-- Show All Button -->
  <button id="showAllBtn" class="mt-2 w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition duration-300">
    Show All Aircrafts
  </button>

  <!-- Table -->
  <table id="aircraftTable" class="mt-6 w-full border-collapse border border-gray-300 hidden">
    <thead>
      <tr class="bg-blue-200 text-blue-800 font-semibold">
        <th class="border p-2">Aircraft ID</th>
        <th class="border p-2">Name</th>
        <th class="border p-2">Reg. Number</th>
        <th class="border p-2">Price ($)</th>
        <th class="border p-2">Country</th>
        <th class="border p-2">Speed (km/h)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API_URL = "http://127.0.0.1:8000/aircrafts";

// Toast notification
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.classList.remove("hidden");
  setTimeout(() => toast.classList.add("hidden"), 2000);
}

// Render table
function renderTable(aircrafts) {
  const table = document.getElementById("aircraftTable");
  const tbody = table.querySelector("tbody");
  tbody.innerHTML = "";

  aircrafts.forEach(a => {
    tbody.innerHTML += `
      <tr class="border p-2 even:bg-gray-100 odd:bg-white hover:bg-yellow-100">
        <td class="border p-2">${a.id}</td>
        <td class="border p-2">${a.name}</td>
        <td class="border p-2">${a.reg_number}</td>
        <td class="border p-2">$${a.price.toLocaleString()}</td>
        <td class="border p-2">${a.country}</td>
        <td class="border p-2">${a.speed}</td>
      </tr>
    `;
  });

  table.classList.remove("hidden");
}

// Fetch all aircrafts
async function fetchAllAircrafts() {
  const res = await fetch(API_URL);
  const aircrafts = await res.json();
  renderTable(aircrafts);
  return aircrafts;
}

// Add aircraft
document.getElementById("aircraftForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {
    name: name.value,
    reg_number: reg_number.value,
    price: Number(price.value),
    country: country.value,
    speed: Number(speed.value),
  };
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  const result = await res.json();
  showToast(result.message || "Aircraft added!");
  e.target.reset();
});

// Show all
document.getElementById("showAllBtn").addEventListener("click", fetchAllAircrafts);

// Search
document.getElementById("searchBtn").addEventListener("click", async () => {
  const name = document.getElementById("searchName").value.trim();
  const reg = document.getElementById("searchReg").value.trim();

  if (!name && !reg) {
    showToast("Enter Name or Reg. Number to search");
    return;
  }

  let url = API_URL + "/find/?";
  if (name) url += `name=${encodeURIComponent(name)}&`;
  if (reg) url += `reg_number=${encodeURIComponent(reg)}`;

  const res = await fetch(url);
  const result = await res.json();

  if (result.error) {
    showToast(result.error);
    document.getElementById("aircraftTable").classList.add("hidden");
  } else {
    // Wrap single object in array if needed
    const aircrafts = Array.isArray(result) ? result : [result];
    renderTable(aircrafts);
  }
}); 

// Reset search
document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("searchName").value = "";
  document.getElementById("searchReg").value = "";
  fetchAllAircrafts();
});

</script>
</body>
</html>
